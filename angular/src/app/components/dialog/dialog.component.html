<dialog class="dialog" #appDialog>
  <p class="dialog__message">{{ message }}</p>
  <div class="dialog__button-group">
    <app-button id="dialog-confirmation-button" variant="accent" (click)="confirm.emit()">
      Aceptar
    </app-button>
    <app-button id="dialog-cancel-button" variant="danger" (click)="cancelled.emit()">
      Cancelar
    </app-button>
  </div>
</dialog>
