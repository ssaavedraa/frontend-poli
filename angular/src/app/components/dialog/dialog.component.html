<dialog class="dialog" #appDialog>
  <p class="dialog__message">{{ message }}</p>
  <div class="dialog__button-group">
    <!-- TODO: change to button component -->
    <button class="button button--primary" id="dialog-confirmation-button" (click)="confirm.emit()">
      Aceptar
    </button>
    <!-- TODO: change to button component -->
    <button class="button button--danger" id="dialog-cancel-button" (click)="cancelled.emit()">
      Cancelar
    </button>
  </div>
</dialog>
