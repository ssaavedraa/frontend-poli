<main id="news-hub-main" class="contact__container">
  <h1 class="contact__title">Contáctanos</h1>
  <p class="contact__description">Escríbenos directamente. Nuestro equipo editorial y de redacción responderá a tu solicitud lo antes posible.</p>
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact__form" id="contact-form">
    <div class="contact__field">
      <label for="name" class="contact__label">Nombre completo</label>
      <span class="contact__hint">Obligatorio</span>
      <input type="text" id="name" formControlName="name" class="contact__input" placeholder="Ej. Carmen Salinas">
    </div>
    <div class="contact__field">
      <label for="email" class="contact__label">Correo electrónico</label>
      <span class="contact__hint">Obligatorio</span>
      <input type="email" id="email" formControlName="email" class="contact__input" placeholder="nombre@ejemplo.com">
    </div>
    <div class="contact__field">
      <label for="message" class="contact__label">Mensaje</label>
      <span class="contact__hint">Obligatorio</span>
      <textarea resize="none" id="message" formControlName="message" class="contact__input contact__input--textarea" minlength="10" maxlength="500" placeholder="Escribe tu mensaje aquí..." title="El mensaje debe tener entre 10 y 500 caracteres"></textarea>
    </div>
    <app-button
      variant="accent"
      type="submit"
      class="contact__submit"
      [disabled]="contactForm.invalid"
    >
      Enviar mensaje
    </app-button>
    @if (showSuccessMessage()) {
      <p id="contact-success-message" class="contact__success-message">Mensaje enviado correctamente</p>
    }
  </form>
</main>
