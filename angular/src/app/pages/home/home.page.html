  <main class="home__container">
  <app-hero [heroData]="heroPost"/>
  <section class="home__card-container">
    @for (post of featuredPosts; track post.id) {
      <app-card [post]="post"/>
    }
  </section>
  <!-- TODO: replace empty state with a component -->
  <section class="home__actions">
    <a class="home__list-link" routerLink="/list">Ver todas las noticias</a>
    <a class="button button--accent" routerLink="/create">Crear noticia</a>
  </section>
</main>
