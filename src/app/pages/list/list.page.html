<main id="news-hub-main" class="list__container">
  <h1 class="list__title">Todas las noticias</h1>
  <p class="list__subtitle">
    Archivo centralizado de coberturas exclusivas, reportajes a profundidad y crónicas de
    actualidad.
  </p>
  @if (posts.length) {
    <section class="list__card-container">
      @for (post of posts; track post.id) {
        <app-card [post]="post" />
      }
    </section>
  } @else {
    <section class="empty-list__container">
      <p class="empty-list__title">No hay noticias</p>
      <a class="empty-list__link" routerLink="/create">Crear una</a>
    </section>
  }
</main>
