<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../../globals.css">
  <link rel="stylesheet" href="../styles/header.component.css">
  <link rel="stylesheet" href="../styles/footer.component.css">
  <link rel="stylesheet" href="../styles/button.component.css">
  <link rel="stylesheet" href="../styles/dialog.component.css">
  <link rel="stylesheet" href="../styles/detail.page.css">
  <script type="module" src="../scripts/layout.js" defer></script>
  <script type="module" src="../scripts/detail.page.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsHub | Home</title>
</head>
<body>
  <header id="header-slot" class="header"></header>
  <main id="news-hub-main" class="detail__container">
    <img id="news-image" class="detail__image" src="" alt="Imagen de la noticia">
    <section class="detail-buttons__container">
      <button id="favorites-button" class="button button--primary">Add to Favorites</button>
      <button id="delete-button" class="button button--danger">Delete Article</button>
    </section>
    <h1 id="news-title" class="detail__title"></h1>
    <h2 id="news-subtitle" class="detail__subtitle"></h2>
    <hr class="detail__separator">
    <section id="news-content" class="detail__content"></section>
  </main>
  <footer id="footer-slot" class="footer"></footer>
  <dialog id="confirmation-dialog" class="dialog"></dialog>
</body>
</html>
